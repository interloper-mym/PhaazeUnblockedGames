<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phaaze Games</title>
<style>
  :root {
    --bg: #0f1019;
    --surface: #1a1c2b;
    --surface-hover: #232540;
    --border: #2c2e42;
    --text: #f2f2f7;
    --muted: #9a9ab0;
    --accent: #7c5cff;
    --accent-hover: #9375ff;
    --splash-color: #ffff00;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    padding-bottom: 70px;
  }

  header { padding: 28px 16px 12px; text-align: center; }
  header h1 {
    margin: 0 0 4px;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    position: relative;
    display: inline-block;
  }
  header p { margin: 0; color: var(--muted); }

  #splashText {
    position: absolute;
    top: 38px;
    left: 100%;
    margin-left: 10px;
    transform: rotate(-20deg);
    transform-origin: bottom left;
    color: var(--splash-color);
    text-shadow: 1.5px 1.5px 0 rgba(0,0,0,0.6);
    font-size: 0.9rem;
    font-weight: 700;
    font-style: italic;
    white-space: nowrap;
    pointer-events: none;
    animation: splash-bounce 0.7s infinite alternate ease-in-out;
  }
  @keyframes splash-bounce {
    from { transform: rotate(-20deg) scale(1); }
    to   { transform: rotate(-20deg) scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce) {
    #splashText { animation: none; }
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 700px;
    margin: 20px auto 0;
    padding: 0 16px;
  }
  #searchInput {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
  }
  #searchInput:focus { outline: none; border-color: var(--accent); }

  .category-bar {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 18px 0 0;
  }
  .category-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .category-btn:hover { border-color: var(--accent); }
  .category-btn.active { background: var(--accent); border-color: var(--accent); }

  #gamesContainer {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    max-width: 1000px;
    margin: 32px auto;
    padding: 0 24px;
  }
  .game-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .game-card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .new-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--accent);
    color: white;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .game-thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 10px;
    background: #0a0a12;
  }
  .game-name { font-weight: 600; font-size: 0.95rem; text-align: center; }
  .game-tag { margin-top: 6px; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .empty-state { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }

  #zoneViewer {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    display: none;
    flex-direction: column;
  }
  .zone-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #zoneName { margin: 0; font-size: 1.1rem; font-weight: 700; }
  .zone-controls { display: flex; gap: 8px; }
  .zone-controls button {
    background: var(--surface-hover);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .zone-controls button:hover { border-color: var(--accent); }
  #zoneFrame { flex-grow: 1; border: none; width: 100%; height: 100%; }
  #zoneLoading {
    position: absolute;
    inset: 0;
    top: 57px;
    background: var(--bg);
    color: var(--muted);
    display: none;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    z-index: 1;
  }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    text-align: center;
    padding: 10px;
    font-size: 0.8rem;
    color: var(--muted);
    background: rgba(0,0,0,0.3);
  }
  .footer-link-btn {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 0.8rem;
    text-decoration: underline;
    padding: 0;
  }
</style>
</head>
<body>

<header>
  <h1 id="siteTitle">Phaaze Games <span id="splashText"></span></h1>
  <p id="siteTagline">play something during a free period</p>
</header>

<div class="category-bar" id="categoryBar"></div>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Search games" />
</div>

<div id="gamesContainer">Loading…</div>

<div id="zoneViewer">
  <div class="zone-header">
    <h2 id="zoneName">Game</h2>
    <div class="zone-controls">
      <button onclick="fullscreenZone()">Fullscreen</button>
      <button onclick="newTabZone()">Open in new tab</button>
      <button onclick="closeZone()">Close</button>
    </div>
  </div>
  <div id="zoneLoading">Loading…</div>
  <iframe id="zoneFrame" allow="fullscreen"></iframe>
</div>

<footer>
  <span id="footerSiteName">Phaaze Games</span>
  &nbsp;·&nbsp;
  <button class="footer-link-btn" onclick="downloadSite()">Download this site</button>
  &nbsp;·&nbsp;
  <a class="footer-link-btn" href="https://discord.gg/gnndNWXZtC" target="_blank" rel="noopener noreferrer" style="text-decoration:underline;">Discord</a>
</footer>

<script>
// ============================================================
// SITE THEME
// ============================================================
const SITE_NAME = "Phaaze Games";
const SITE_TAGLINE = "play something during a free period";
const THEME = {
  bg: "#0f1019",
  surface: "#1a1c2b",
  surfaceHover: "#232540",
  border: "#2c2e42",
  text: "#f2f2f7",
  muted: "#9a9ab0",
  accent: "#7c5cff",
  accentHover: "#9375ff",
  splashColor: "#ffff00"
};

function applyTheme() {
  const root = document.documentElement.style;
  root.setProperty("--bg", THEME.bg);
  root.setProperty("--surface", THEME.surface);
  root.setProperty("--surface-hover", THEME.surfaceHover);
  root.setProperty("--border", THEME.border);
  root.setProperty("--text", THEME.text);
  root.setProperty("--muted", THEME.muted);
  root.setProperty("--accent", THEME.accent);
  root.setProperty("--accent-hover", THEME.accentHover);
  document.documentElement.style.setProperty("--splash-color", THEME.splashColor);

  document.title = SITE_NAME;
  const titleEl = document.getElementById("siteTitle");
  const taglineEl = document.getElementById("siteTagline");
  if (titleEl) titleEl.firstChild.textContent = SITE_NAME + " ";
  if (taglineEl) taglineEl.textContent = SITE_TAGLINE;
  const footerNameEl = document.getElementById("footerSiteName");
  if (footerNameEl) footerNameEl.textContent = SITE_NAME;
}

// ============================================================
// GITHUB REPO SETTINGS
// GitHub Pages serves .html as text/html (unlike jsDelivr which
// sometimes serves text/plain), so games render instead of
// showing as code. Also fixes Klonoa's black screen via CORS.
// ============================================================
const GITHUB_USER = "interloper-mym";
const GITHUB_REPO = "PhaazeUnblockedGames";
const CDN_BASE = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/`;

// ============================================================
// SPLASH TEXT
// ============================================================
const splashes = [
  "Off to go hang myself!",
  "hamburger",
  "Ctr+shift+q+q your self NOW",
  "seartch dibs furry game",
  "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
  "MAKEING THIS SHIT WORK IS 2 HARD.",
  "mym wuz here",
  "Color purple, Go play with your FRIENDS!"
];

// ============================================================
// State
// ============================================================
let items = [];
let currentCategory = "all";
let currentSearch = "";
let lastGameUrl = null;
let lastGameName = null;
let lastGameHtml = null;

const container = document.getElementById("gamesContainer");
const searchInput = document.getElementById("searchInput");
const categoryBar = document.getElementById("categoryBar");
const zoneViewer = document.getElementById("zoneViewer");
const zoneFrame = document.getElementById("zoneFrame");
const zoneLoading = document.getElementById("zoneLoading");
const zoneName = document.getElementById("zoneName");

function resolveUrl(path) {
  if (/^https?:\/\//i.test(path)) return path;
  return CDN_BASE + path;
}

function showSplashText() {
  const el = document.getElementById("splashText");
  if (el) el.textContent = splashes[Math.floor(Math.random() * splashes.length)];
}

// ============================================================
// Load games.json
// ============================================================
async function loadGamesList() {
  container.innerHTML = "Loading games…";
  try {
    const res = await fetch(CDN_BASE + "games.json?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    items = await res.json();
  } catch (err) {
    container.innerHTML =
      '<p class="empty-state">Couldn\'t load games.json (' +
      String(err.message).replace(/</g, "&lt;") +
      "). Check GITHUB_USER/REPO at the top of the script, and that games.json exists in your repo.</p>";
    return;
  }
  buildCategoryBar();
  render();
}

// ============================================================
// Category bar + search + cards
// ============================================================
function buildCategoryBar() {
  const cats = ["all", ...new Set(items.map(i => i.category))];
  categoryBar.innerHTML = "";
  cats.forEach(cat => {
    const count = cat === "all" ? items.length : items.filter(i => i.category === cat).length;
    const btn = document.createElement("button");
    btn.className = "category-btn" + (cat === "all" ? " active" : "");
    const label = cat === "all" ? "All" : cat.charAt(0).toUpperCase() + cat.slice(1);
    btn.textContent = `${label} (${count})`;
    btn.onclick = () => {
      currentCategory = cat;
      document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    };
    categoryBar.appendChild(btn);
  });
}

function render() {
  const filtered = items.filter(item => {
    const matchesCategory = currentCategory === "all" || item.category === currentCategory;
    const matchesSearch = item.name.toLowerCase().includes(currentSearch.toLowerCase());
    return matchesCategory && matchesSearch;
  });

  container.innerHTML = "";

  if (filtered.length === 0) {
    container.innerHTML = '<p class="empty-state">Nothing here yet.</p>';
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement("div");
    card.className = "game-card";
    card.onclick = () => openZone(item);

    if (item.new) {
      const badge = document.createElement("span");
      badge.className = "new-badge";
      badge.textContent = "NEW";
      card.appendChild(badge);
    }

    if (item.image) {
      const img = document.createElement("img");
      img.src = resolveUrl(item.image);
      img.alt = item.name;
      img.className = "game-thumb";
      img.onerror = () => { img.style.display = "none"; };
      card.appendChild(img);
    }

    const label = document.createElement("span");
    label.className = "game-name";
    label.textContent = item.name;
    card.appendChild(label);

    const tag = document.createElement("span");
    tag.className = "game-tag";
    tag.textContent = item.category;
    card.appendChild(tag);

    container.appendChild(card);
  });
}

// ============================================================
// Game viewer
// The iframe uses direct src (so Klonoa's emulator runs on
// GitHub Pages' origin and its ROM fetch is CORS-clean).
// We ALSO fetch the HTML in the background so the "Open in new
// tab" button can write it into an about:blank window.
// ============================================================
function openZone(item) {
  if (item.category === "link" || /^https?:\/\//i.test(item.path)) {
    window.open(resolveUrl(item.path), "_blank");
    return;
  }

  const resolved = resolveUrl(item.path);
  lastGameUrl = resolved;
  lastGameName = item.name;
  lastGameHtml = null;

  zoneName.textContent = item.name;
  zoneLoading.style.display = "flex";
  zoneLoading.textContent = "Loading…";
  zoneViewer.style.display = "flex";

  zoneFrame.onload = () => { zoneLoading.style.display = "none"; };
  zoneFrame.src = resolved;

  fetch(resolved + "?t=" + Date.now())
    .then(res => res.ok ? res.text() : Promise.reject(new Error("HTTP " + res.status)))
    .then(html => { lastGameHtml = html; })
    .catch(() => { lastGameHtml = null; });
}

function closeZone() {
  zoneViewer.style.display = "none";
  zoneFrame.src = "about:blank";
  lastGameUrl = null;
  lastGameName = null;
  lastGameHtml = null;
}

function fullscreenZone() {
  const req = zoneFrame.requestFullscreen
    || zoneFrame.webkitRequestFullscreen
    || zoneFrame.mozRequestFullScreen
    || zoneFrame.msRequestFullscreen;
  if (req) req.call(zoneFrame);
}

function newTabZone() {
  if (!lastGameHtml) {
    alert("Still loading — try again in a second.");
    return;
  }
  const w = window.open("about:blank", "_blank");
  if (w) {
    w.document.open();
    w.document.write(lastGameHtml);
    w.document.close();
  } else {
    alert("Your browser blocked the popup — allow popups for this site and try again.");
  }
}

async function downloadSite() {
  try {
    const res = await fetch(location.href.split("?")[0] + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const html = await res.text();
    triggerDownload(html, "phaaze-games.html", "text/html;charset=utf-8");
  } catch (err) {
    if (zoneViewer.style.display === "flex") closeZone();
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    triggerDownload(html, "phaaze-games.html", "text/html;charset=utf-8");
  }
}

function triggerDownload(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================================================
// Wire up + start
// ============================================================
searchInput.addEventListener("input", e => {
  currentSearch = e.target.value;
  render();
});

applyTheme();
showSplashText();
loadGamesList();
</script>
</body>
</html>
